    <rect x="186" y="330" width="228" height="66" rx="20" fill="#4A3D32"/>
    <rect x="186" y="330" width="228" height="20" rx="10" fill="#6B5344"/>
    <rect x="250" y="470" width="100" height="8" rx="4" fill="#ffffff" opacity="0.75"/>
    <rect x="266" y="490" width="68" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
    
  <!-- brand mark -->
  <text x="300" y="712" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="6" fill="#4A3D32" opacity="0.85">VLAECCI</text>
  <text x="300" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="4" fill="#6B5344" opacity="0.6">MASKA</text>
