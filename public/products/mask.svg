      <stop offset="0" stop-color="#FDFCFA"/><stop offset="1" stop-color="#EDE8E0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#4A3D32" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="360" r="230" fill="#4A3D32" opacity="0.10"/>
